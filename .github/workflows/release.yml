name: Release

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate version and tag
        id: meta
        env:
          RELEASE_EVENT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node .github/scripts/release-meta.mjs
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Test frontend utilities and locales
        run: node --experimental-strip-types --test tests/file-tree.test.mjs tests/locales.test.mjs
      - name: Test release validation
        run: node --test tests/release-meta.test.mjs tests/updater-manifest.test.mjs tests/release-notes.test.mjs
      - name: Prepare release notes
        run: node .github/scripts/release-notes.mjs "${{ steps.meta.outputs.tag }}" release-body.md
      - name: Validate updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) { console.error('Set the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing updates.'); process.exit(1); }"
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          releases=$(gh api --paginate --slurp "repos/{owner}/{repo}/releases?per_page=100")
          release=$(jq -c --arg tag "$RELEASE_TAG" 'flatten | map(select(.tag_name == $tag)) | first // null' <<< "$releases")
          if [[ "$release" == null ]]; then
            release_id=$(gh api --method POST "repos/{owner}/{repo}/releases" \
              -f tag_name="$RELEASE_TAG" -f target_commitish="$RELEASE_SHA" -f name="$RELEASE_TAG" \
              -F draft=true -F body=@release-body.md --jq .id)
          elif [[ "$(jq -r .draft <<< "$release")" == true ]]; then
            release_id=$(jq -r .id <<< "$release")
          else
            echo "Release $RELEASE_TAG is already published; bump the app version."
            exit 1
          fi
          if [[ ! "$release_id" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve the draft release ID for $RELEASE_TAG."
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --notes-file release-body.md
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}
      - run: npm ci
      - name: Configure deterministic Git test behavior
        run: git config --global core.autocrlf false
      - name: Test Rust backend
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build and upload installers to draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: ${{ matrix.args }} -- --locked

  publish:
    name: Publish completed release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Attach localized release notes and validate updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir updater-manifest
          node .github/scripts/release-notes.mjs "$RELEASE_TAG" release-body.md updater-manifest/latest.json
          node .github/scripts/check-updater-manifest.mjs updater-manifest/latest.json "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" updater-manifest/latest.json --clobber
          gh release edit "$RELEASE_TAG" --notes-file release-body.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
